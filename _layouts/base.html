<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }} &mdash; {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
{% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }} &mdash; {{ site.tagline }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- assign ogkey = page.og_photo | default: 'hero-city' -%}
{%- assign og = site.data.photos[ogkey] -%}
<meta property="og:image" content="{{ og.jpg | absolute_url }}">
<meta property="og:image:alt" content="{{ og.alt | escape }}">
<meta name="twitter:card" content="summary_large_image">
{% include style.html %}
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script>
/* No libraries. Two jobs: the mobile menu, and the develop-on-scroll reveal.
   The .dev class hides nothing unless this script has run (html.js), so a
   failed or blocked script leaves every photograph fully visible. */
(function(){
  var d=document, r=d.documentElement;
  r.className+=' js';

  var b=d.getElementById('burger'), m=d.getElementById('menu');
  if(b&&m){
    b.addEventListener('click',function(){
      b.setAttribute('aria-expanded', m.classList.toggle('open')?'true':'false');
    });
    m.addEventListener('click',function(e){
      if(e.target.closest('a')){m.classList.remove('open');b.setAttribute('aria-expanded','false');}
    });
  }

  var frames=[].slice.call(d.querySelectorAll('.dev'));
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function all(){for(var i=0;i<frames.length;i++)frames[i].classList.add('in');}
  if(reduce||!('IntersectionObserver' in window)){all();return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);} });
  },{rootMargin:'0px 0px -8% 0px',threshold:.06});
  frames.forEach(function(f){io.observe(f);});
  /* Safety net: nothing stays undeveloped, whatever the observer does. */
  setTimeout(all,4000);
})();
</script>
</body>
</html>
